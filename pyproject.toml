[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcrucible"
version = "0.1.0"
description = "Agentic prompt optimization for any document extraction pipeline. Stop tuning prompts blindly."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hitarth Desai", email = "hitarthbuilds@gmail.com" }]
keywords = ["llm", "prompt", "optimization", "extraction", "document", "ai", "agents", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "aiosqlite>=0.20",
  "pdfplumber>=0.11",
  "deepdiff>=7.0",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.scripts]
crucible = "promptcrucible.cli:cli"

[project.urls]
Homepage = "https://github.com/hitarthbuilds/prompt-crucible"
Repository = "https://github.com/hitarthbuilds/prompt-crucible"
Issues = "https://github.com/hitarthbuilds/prompt-crucible/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptcrucible*"]

[tool.setuptools.package-data]
promptcrucible = ["ui/*", "ui/**/*"]
